name: watch
on:
  schedule:
    # Offset from :00/:30 on purpose: GitHub sheds scheduled runs at peak minutes.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Fire a test alert instead of sweeping (verifies the email channel)"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: inputs.test_alert
        run: >-
          ./notify-hook "Test alert"
          "The email channel works. A real alert reads 'Seats open 2026-08-08
          7:00pm, F11-F12'. You can close this issue."

      - name: Run sweep
        if: ${{ !inputs.test_alert }}
        run: python3 -u watch.py --once

      - name: Persist state
        shell: powershell
        run: |
          git config user.name "odyssey-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add state.json alerts.log 2>$null
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
              $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm") + " UTC"
              git commit -m "state: sweep $ts"
              git pull --rebase --autostash origin main
              git push
          }
